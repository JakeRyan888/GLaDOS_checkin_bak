name: GLaDOS 每日签到

on:
  workflow_dispatch:
  schedule:
    
    - cron: 5 0 * * *
  watch:
    types: [started]

jobs:
  checkin:
    # 沿用 Windows Runner；配置 UA 不会改变 Runner 的实际环境。
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install --upgrade requests

      - name: Run offline tests
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: python -m unittest discover -s tests -v

      - name: Run GLaDOS check-in
        shell: pwsh
        env:
          PYTHONUTF8: '1'
          GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
          GLADOS_USER_AGENT: ${{ secrets.GLADOS_USER_AGENT }}
          GLADOS_BROWSER_HEADERS: ${{ secrets.GLADOS_BROWSER_HEADERS }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python glados.py
