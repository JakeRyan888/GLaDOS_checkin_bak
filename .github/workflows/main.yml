name: GLaDOS 每日签到

on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'
  watch:
    types: [started]

jobs:
  checkin:
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install --upgrade requests

      - name: Run GLaDOS check-in
        shell: pwsh
        env:
          GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python glados.py
